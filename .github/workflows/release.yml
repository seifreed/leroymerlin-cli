name: Release

# On a pushed tag vX.Y.Z, cross-compile and publish a GitHub Release (binaries +
# checksums) that install.sh downloads from. No untrusted github.event inputs are
# used; the only secret is the workflow-scoped GITHUB_TOKEN.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GoReleaser needs to create the release and upload assets.

jobs:
  # A tag push does not trigger ci.yml (that one watches main and PRs), so the
  # gate runs here too: without it a tag publishes binaries nothing tested.
  verify:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
